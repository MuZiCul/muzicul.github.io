    <!-- 检查未加载的脚本 -->
    <script>
    window.addEventListener('DOMContentLoaded', function() {
        function checkScript(src) {
            return document.querySelector('script[src="' + src + '"]') !== null;
        }
        
        // 检查核心脚本是否加载
        var scripts = [
            'statics/js/Week.js',
            'statics/js/common-data.js',
            'statics/js/player-data.js',
            'statics/js/merchant-data.js',
            'statics/js/guide-data.js',
            'statics/js/contribution-data.js',
            'statics/js/poverty-data.js',
            'statics/js/guide-render.js',
            'statics/js/contribution-render.js',
            'statics/js/poverty-render.js',
            'statics/js/main.js',
            'statics/js/browser-check.js'
        ];
        
        var missingScripts = scripts.filter(function(src) {
            return !checkScript(src);
        });
        
        if (missingScripts.length > 0) {
            console.error('缺少以下脚本文件:', missingScripts.join(', '));
            // 创建错误提示
            var errorDiv = document.createElement('div');
            errorDiv.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(255,0,0,0.8);color:white;padding:10px;z-index:9999;border-radius:5px;font-size:14px;';
            errorDiv.textContent = '缺少脚本文件: ' + missingScripts.join(', ');
            document.body.appendChild(errorDiv);
        }
    });
    </script>
